name: CI

on:
  pull_request:
    branches: [main, release, 'release/**']
  push:
    branches: [main, release, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify change classification
        run: python3 scripts/test-ci-changes.py

      - name: Classify changed files
        id: filter
        run: python3 scripts/ci-changes.py

  work:
    name: work checks
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') && (
      (github.event_name == 'pull_request' && ((github.event.pull_request.stack.base.ref || github.base_ref) == 'release' || startsWith(github.event.pull_request.stack.base.ref || github.base_ref, 'release/'))) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/')))
      )
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      determinism: ${{ steps.determinism.outputs.digest }}
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          cc --version

      - name: Check formatting and lint
        if: github.event_name == 'pull_request'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo clippy -p rin --no-default-features --locked --all-targets -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --locked --no-deps

      - name: Compare Debug and Release results
        id: determinism
        run: sh scripts/check-determinism.sh

      - name: Run tests
        run: |
          cargo test --workspace --locked
          cargo test -p rin --no-default-features --locked --all-targets

  release:
    name: release checks
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.event.pull_request.stack.base.ref || github.base_ref) == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      determinism: ${{ steps.determinism.outputs.digest }}
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          cc --version

      - name: Check formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo clippy -p rin --no-default-features --locked --all-targets -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --locked --no-deps

      - name: Compare Debug and Release results
        id: determinism
        run: sh scripts/check-determinism.sh

      - name: Run tests (debug, release, and no-default-features)
        run: |
          cargo test --workspace --locked
          cargo test --workspace --locked --release
          cargo test -p rin --no-default-features --locked --all-targets

      - name: Verify release library artifact
        run: |
          cargo build --release --workspace --locked
          test -f target/release/librin.a
          test -f rin/include/rin.h

  determinism-linux:
    name: determinism (Linux)
    needs: changes
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      determinism: ${{ steps.determinism.outputs.digest }}
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check specification examples and separate processes
        run: cargo test --locked -p rin --test spec_cases
      - name: Compare Debug and Release results
        id: determinism
        run: sh scripts/check-determinism.sh

  determinism-platforms:
    name: determinism (platform comparison)
    needs: [changes, work, release, determinism-linux]
    if: >-
      always() && !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare macOS and Linux results
        env:
          MACOS_DIGEST: ${{ needs.work.outputs.determinism || needs.release.outputs.determinism }}
          LINUX_DIGEST: ${{ needs.determinism-linux.outputs.determinism }}
        run: |
          test -n "$MACOS_DIGEST"
          test -n "$LINUX_DIGEST"
          test "$MACOS_DIGEST" = "$LINUX_DIGEST"
